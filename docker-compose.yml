services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearleaf}
      POSTGRES_USER: ${POSTGRES_USER:-clearleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearleaf} -d ${POSTGRES_DB:-clearleaf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      [
        "sh",
        "-lc",
        "psql -h postgres -U ${POSTGRES_USER:-clearleaf} -d ${POSTGRES_DB:-clearleaf} -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ${POSTGRES_USER:-clearleaf};'"
      ]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clearleaf}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-clearleaf}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/clearleaf-realm.json:/opt/keycloak/data/import/clearleaf-realm.json:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearleaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clearleaf}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-clearleaf}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: clearleaf
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-change-me}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/clearleaf/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/clearleaf
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
      APP_LEGAL_CURRENT_VERSION: ${APP_LEGAL_CURRENT_VERSION:-2026-05-30}
      USER_CREATION_APPROVAL_REQUIRED: ${USER_CREATION_APPROVAL_REQUIRED:-Y}
      APP_SIGNUP_APPROVAL_EMAIL_TO: ${APP_SIGNUP_APPROVAL_EMAIL_TO:-admin@clearleaf.local}
      APP_SIGNUP_PASSWORD_ENCRYPTION_KEY: ${APP_SIGNUP_PASSWORD_ENCRYPTION_KEY:-local-dev-change-me}
      APP_SIGNUP_APPROVAL_TOKEN_DAYS: ${APP_SIGNUP_APPROVAL_TOKEN_DAYS:-7}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      APP_STORAGE_MINIO_ENDPOINT: http://minio:9000
      APP_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-clearleaf}
      APP_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      APP_STORAGE_MINIO_BUCKET: ${APP_STORAGE_MINIO_BUCKET:-clearleaf-media}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
        NEXT_PUBLIC_LEGAL_CURRENT_VERSION: ${APP_LEGAL_CURRENT_VERSION:-2026-05-30}
        NEXT_PUBLIC_USER_CREATION_APPROVAL_REQUIRED: ${USER_CREATION_APPROVAL_REQUIRED:-Y}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_LEGAL_CURRENT_VERSION: ${APP_LEGAL_CURRENT_VERSION:-2026-05-30}
      NEXT_PUBLIC_USER_CREATION_APPROVAL_REQUIRED: ${USER_CREATION_APPROVAL_REQUIRED:-Y}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak

volumes:
  postgres-data:
  minio-data:
